name: CI

on:
  push:
    branches: [main, master, dot-4-all-12]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  ENVIRONMENT: development

jobs:
  # ── Backend: pytest ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist  # parallel test execution

      - name: Run pytest (parallel)
        run: pytest app/tests/ -q --tb=short -n auto
        env:
          ENVIRONMENT: development
          # Use in-memory DB for CI (faster, no file I/O)
          # DB tests that need persistence are scoped appropriately

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7

  # ── Frontend: build ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Frontend: lint ───────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

  # ── Backend: lint ────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install lint deps
        run: pip install ruff

      - name: Lint
        run: ruff check app/ --output-format=text

  # ── E2E: Playwright (mock API) ──────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend deps
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Start backend (mock/test mode)
        run: |
          # T2.9 / R6 — backend đồng bộ port 8001 với frontend vite.config.js & API client.
          ENVIRONMENT=development uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          BACKEND_PID=$!
          # Readiness loop: poll /api/system/health tối đa 30s; fail nếu không 200
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8001/api/system/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Backend không sẵn sàng ở :8001 sau 30s"; cat /tmp/health.json 2>/dev/null || true
            kill $BACKEND_PID 2>/dev/null || true
            exit 1
          fi
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV

      - name: Start frontend preview
        working-directory: frontend
        run: |
          npx vite preview --port 5173 &
          FRONTEND_PID=$!
          sleep 3
          echo "FRONTEND_PID=$FRONTEND_PID" >> $GITHUB_ENV

      - name: Run Playwright E2E
        working-directory: frontend
        # T2.9 — bỏ || true / continue-on-error để job fail khi E2E fail.
        # E2E phải dùng app factory thật với DB/media giả (không camera thật).
        run: npm run test:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          kill ${{ env.BACKEND_PID }} 2>/dev/null || true
          kill ${{ env.FRONTEND_PID }} 2>/dev/null || true

  # ── Production routes smoke test ──────────────────────────────────────────────
  production-routes:
    name: Production routes check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Production smoke test
        run: |
          # Test with ENVIRONMENT=production (no JWT_SECRET → must fail gracefully)
          ENVIRONMENT=production python -c "
import os, sys
os.environ['ENVIRONMENT'] = 'production'
os.environ.pop('JWT_SECRET_KEY', None)
try:
    import app.config as cfg
    # Should raise error on production startup without JWT_SECRET_KEY
    print('ERROR: Should have failed in production without JWT_SECRET_KEY')
    sys.exit(1)
except ValueError as e:
    if 'JWT_SECRET_KEY must be set' in str(e):
        print('PASS: Production startup correctly refuses without JWT_SECRET_KEY')
        sys.exit(0)
    else:
        print(f'UNEXPECTED ERROR: {e}')
        sys.exit(1)
except Exception as e:
    print(f'UNEXPECTED: {type(e).__name__}: {e}')
    sys.exit(1)
          "

      - name: Dev mode startup smoke
        run: |
          ENVIRONMENT=development python -c "
import os
os.environ['ENVIRONMENT'] = 'development'
# Should start without JWT_SECRET_KEY (uses ephemeral)
from app.config import JWT_SECRET_KEY, ENVIRONMENT
print(f'ENVIRONMENT={ENVIRONMENT}')
print(f'JWT_SECRET_KEY is set: {bool(JWT_SECRET_KEY)}')
# Verify secret is not empty
assert len(JWT_SECRET_KEY) >= 32, 'JWT_SECRET_KEY too short'
print('PASS: Dev mode starts with ephemeral key')
          "
