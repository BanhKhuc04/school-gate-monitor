# Vietnamese license plate character detection dataset.
# Source: user-supplied yolo_plate_ocr_dataset.zip (3188 images, decoded via
# the reference legend image "0.jpg" which contains all 36 classes laid out
# in a grid — see datasets/plate_char_ocr/README.md for how this was verified).
#
# Each character on a plate is its own bounding box (not the whole plate).
# Intended replacement for EasyOCR generic OCR in app/cv/ocr.py — trains a
# YOLO detector that reads a plate by detecting each character directly,
# which handles small/angled motorbike plates far better than generic OCR.

path: .
train: images/train
val: images/val

