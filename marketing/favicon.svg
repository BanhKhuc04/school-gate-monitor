<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- School Gate Monitor icon — flat vector, navy + red, no gradients/shadows -->
  <!-- Red "open book" flourish, top corners -->
  <polygon points="30,58 30,20 66,42" fill="#C92035"/>
  <polygon points="170,58 170,20 134,42" fill="#C92035"/>
  <!-- Navy "open book" side panels -->
  <polygon points="30,58 30,150 66,168 66,42" fill="#123B6D"/>
  <polygon points="170,58 170,150 134,168 134,42" fill="#123B6D"/>
  <!-- Gate arch -->
  <path d="M66 68 Q100 44 134 68 L134 84 Q100 64 66 84 Z" fill="#123B6D"/>
  <!-- Gate posts -->
  <rect x="66" y="84" width="14" height="76" fill="#123B6D"/>
  <rect x="120" y="84" width="14" height="76" fill="#123B6D"/>
  <!-- CCTV camera on top of the arch -->
  <g fill="#123B6D">
    <rect x="92" y="30" width="8" height="18" rx="2"/>
    <rect x="70" y="16" width="46" height="18" rx="6" transform="rotate(-8 93 25)"/>
    <circle cx="110" cy="24" r="7" transform="rotate(-8 93 25)"/>
  </g>
  <!-- Two figures walking through the gate -->
  <g fill="#123B6D">
    <circle cx="88" cy="118" r="10"/>
    <rect x="76" y="130" width="24" height="34" rx="8"/>
    <rect x="70" y="134" width="8" height="18" rx="3"/>
    <circle cx="116" cy="126" r="8"/>
    <rect x="106" y="136" width="20" height="28" rx="7"/>
  </g>
</svg>
